<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#153d36" />
  <meta name="description" content="Stock Control — manage supplies, stock movements, manager requests and WhatsApp order tickets." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Stock Control | Operations</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Stock Control home">
        <span class="brand-mark">▦</span><span><strong>Stock Control</strong><small>OPERATIONS DESK</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav aria-label="Main navigation" id="nav">
        <button data-view="dashboard" class="nav-link active"><span>◫</span> Overview</button>
        <button data-view="inventory" class="nav-link"><span>▦</span> Inventory</button>
        <button data-view="orders" class="nav-link"><span>☷</span> Order tickets <i id="ticket-pill" class="nav-count"></i></button>
        <button data-view="transfers" class="nav-link"><span>⇄</span> Stock conversions</button>
        <button data-view="activity" class="nav-link"><span>◷</span> Stock history</button>
      </nav>
      <div class="side-label tools-label">MANAGEMENT</div>
      <nav aria-label="Management"><button data-view="settings" class="nav-link"><span>⚙</span> Settings & backups</button></nav>
      <div class="sidebar-bottom"><div class="offline-dot"></div><div><strong>Local prototype</strong><small>Data stays on this device</small></div></div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left"><button id="menu-toggle" class="icon-btn mobile-only" aria-label="Open menu">☰</button><span class="breadcrumb">Stock Control <span class="crumb-divider">/</span> <span id="crumb-current">Overview</span></span></div>
        <div class="topbar-right"><span class="today" id="today-date"></span><span class="avatar">SC</span></div>
      </header>
      <main id="app-main" class="main-content" aria-live="polite"></main>
    </div>
  </div>
  <div id="modal-host"></div><div id="toast-host" aria-live="polite"></div>
  <input type="file" id="backup-import" accept="application/json,.json" hidden />
  <script src="./config.js"></script>
  <script src="./domain.js" defer></script>
  <script src="./backend-local.js" defer></script>
  <script src="./app.js" defer></script>
  <script type="module" src="./firebase-loader.mjs"></script>
</body>
</html>
